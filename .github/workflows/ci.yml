name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -m "not slow"

  controls:
    # The falsification of the whole suite: both controls, end to end, in real subprocesses.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -m slow

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  action:
    # The action as a user runs it. The last run compares with an empty expectation file, so it
    # must fail with exit code 1: a gate that cannot fail has measured nothing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          subject: control-honest
          scenario: |
            openai/basic
            anthropic/stream-early-exit
      - uses: $/
        with:
          subject: control-faulty
          expect: subjects/control-faulty/expected.toml
          scenario: |
            openai/stream-no-usage
            anthropic/cache-hit
            anthropic/stream-early-exit
      - run: touch "$RUNNER_TEMP/empty.toml"
      - id: differs
        uses: $/
        continue-on-error: true
        with:
          subject: control-faulty
          expect: ${{ runner.temp }}/empty.toml
          scenario: openai/stream-no-usage
          artifact-name: spantruth-control-faulty-differs
      - name: The run against an empty expectation file failed with exit code 1
        env:
          OUTCOME: ${{ steps.differs.outcome }}
          CODE: ${{ steps.differs.outputs.exit-code }}
        run: test "$OUTCOME" = failure && test "$CODE" = 1
