name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -m "not slow"

  controls:
    # The falsification of the whole suite: both controls, end to end, in real subprocesses.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -m slow

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  action:
    # The action as a user runs it. The last run compares with an empty expectation file, so it
    # must fail with exit code 1: a gate that cannot fail has measured nothing. `uses: $/` is
    # GitHub's self-repository syntax (July 2026): this repository at the workflow's own commit,
    # independent of what a step left in the workspace. It is not a typo for `./`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment that the second run keeps up to date
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          subject: control-honest
          scenario: |
            openai/basic
            anthropic/stream-early-exit
      - uses: $/
        with:
          subject: control-faulty
          expect: subjects/control-faulty/expected.toml
          comment: "true"
          scenario: |
            openai/stream-no-usage
            anthropic/cache-hit
            anthropic/stream-early-exit
      - run: touch "$RUNNER_TEMP/empty.toml"
      - id: differs
        uses: $/
        continue-on-error: true
        with:
          subject: control-faulty
          expect: ${{ runner.temp }}/empty.toml
          scenario: openai/stream-no-usage
          artifact-name: spantruth-control-faulty-differs
      - name: The run against an empty expectation file failed with exit code 1
        env:
          OUTCOME: ${{ steps.differs.outcome }}
          CODE: ${{ steps.differs.outputs.exit-code }}
        run: test "$OUTCOME" = failure && test "$CODE" = 1
