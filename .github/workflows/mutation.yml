name: Mutation

# Plants small faults in the checks (scripts/mutate.py) and fails when the fast tests still pass
# with one of them. Weekly, because it runs the fast tests once per mutant.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutants:
    name: Mutants of the checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Each test run has the script's own time limit. The runner is a throwaway machine, so it
      # needs no memory cap.
      - run: uv run python scripts/mutate.py
