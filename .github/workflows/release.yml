name: Release

# A release is a tag with notes and a wheel on PyPI. The wheel holds the harness, the CLI and the
# subjects, so `uvx spantruth` runs without a clone.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    # The tag, the package version and the wheel name must agree, or the action ref, the wheel and
    # the results document would each claim a different version.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/spantruth-${TAG#v}-py3-none-any.whl"

  github-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the release
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
      # GitHub has no API for the Marketplace listing: a person ticks "Publish this Action to the
      # GitHub Marketplace" on each release, with 2FA. Without it the listing keeps showing the
      # last version that was published there, so the release leaves an issue with the link.
      - name: Ask for the Marketplace listing
        run: |
          body="GitHub has no API for this step, so it is done by hand on each release.

          1. Open https://github.com/${GH_REPO}/releases/edit/${TAG}
          2. Tick **Publish this Action to the GitHub Marketplace**.
          3. Primary category **Testing**, second category **Monitoring**.
          4. **Update release**, and confirm with 2FA.

          Close this issue when https://github.com/marketplace/actions/spantruth shows \`${GH_REPO}@${TAG}\`."
          gh issue create --title "Publish ${TAG} to the GitHub Marketplace" --body "$body" --assignee chrikrah

  pypi:
    needs: check
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow and this environment, so no token is stored.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
