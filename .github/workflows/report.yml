name: Report

# Runs every subject at its pinned versions and at its latest release, and publishes the
# matrix to GitHub Pages.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Pinned versions
        run: uv run wiretruth run --out site/pinned.json
      - name: Latest releases
        run: uv run wiretruth run --latest --out site/latest.json
      - name: Render
        run: |
          uv run wiretruth report site/pinned.json --html site/index.html
          uv run wiretruth report site/latest.json --html site/latest.html --badges site/badges
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
