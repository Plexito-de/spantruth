name: spantruth
description: Check the values an LLM instrumentation library reports against what the provider sent.
author: Plexito
branding:
  icon: check-circle
  color: green

inputs:
  subject:
    description: >-
      A built-in subject, such as openllmetry, or the path of a subject directory in your
      repository, such as ./spantruth.
    required: true
  with:
    description: >-
      Packages to replace in the subject, one per line: a local checkout such as
      ./packages/my-instrumentation, a git ref, or a version.
    required: false
    default: ""
  scenario:
    description: Scenario IDs to run, one per line. Every scenario when empty.
    required: false
    default: ""
  expect:
    description: >-
      The path of an expectation file. The step fails when the failing checks differ from it.
      Write one with `spantruth run --write-expect FILE`.
    required: false
    default: ""
  latest:
    description: Unpin the subject's tracked packages and the provider SDKs.
    required: false
    default: "false"
  artifact-name:
    description: The name of the artifact with the results and the HTML report.
    required: false
    default: ""

outputs:
  exit-code:
    description: >-
      0 when every cell ran and the failing checks match the expectation file, 1 when they
      differ, 2 for a usage error, 3 when spantruth could not run a cell.
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: The path of the results document.
    value: ${{ steps.run.outputs.results }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-suffix: spantruth

    # Inputs reach the script through the environment only, never through ${{ }} in the script.
    # spantruth is installed from the checkout of this action, so its version is the action ref.
    - id: run
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject }}
        WITH: ${{ inputs.with }}
        SCENARIO: ${{ inputs.scenario }}
        EXPECT: ${{ inputs.expect }}
        LATEST: ${{ inputs.latest }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/spantruth"
        mkdir -p "$out"
        uv venv --quiet --no-config --python 3.12 "$out/venv"
        uv pip install --quiet --no-config --python "$out/venv/bin/python" "$GITHUB_ACTION_PATH"
        spantruth="$out/venv/bin/spantruth"

        args=(run --subject "$SUBJECT" --out "$out/results.json" --summary "$GITHUB_STEP_SUMMARY")
        while read -r line; do
          if [ -n "$line" ]; then args+=(--with "$line"); fi
        done <<< "$WITH"
        while read -r line; do
          if [ -n "$line" ]; then args+=(--scenario "$line"); fi
        done <<< "$SCENARIO"
        if [ -n "$EXPECT" ]; then args+=(--expect "$EXPECT"); fi
        if [ "$LATEST" = "true" ]; then args+=(--latest); fi

        code=0
        "$spantruth" "${args[@]}" || code=$?
        if [ -f "$out/results.json" ]; then
          "$spantruth" report "$out/results.json" --html "$out/report.html" > /dev/null ||
            echo "::warning::spantruth could not render the HTML report"
        fi

        name="${ARTIFACT_NAME:-spantruth-$(basename "$SUBJECT")}"
        {
          echo "exit-code=$code"
          echo "results=$out/results.json"
          echo "artifact-name=$name"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.run.outputs.artifact-name != ''
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: |
          ${{ runner.temp }}/spantruth/results.json
          ${{ runner.temp }}/spantruth/report.html
        if-no-files-found: ignore

    - shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${CODE:-3}"
