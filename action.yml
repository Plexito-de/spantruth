name: spantruth
description: Check the values an LLM instrumentation library reports against what the provider sent.
author: Plexito
branding:
  icon: check-circle
  color: green

inputs:
  command:
    description: >-
      `run` checks one subject, for a library's own repository. `doctor` reads the lock file of an
      application and checks the libraries it uses at its versions. On a pull request it compares
      with the base branch, and fails only on a finding that the change adds.
    required: false
    default: run
  subject:
    description: >-
      For `run`: a built-in subject, such as openllmetry, or the path of a subject directory in
      your repository, such as ./spantruth.
    required: false
    default: ""
  path:
    description: >-
      For `doctor`: the project directory, or one dependency file.
    required: false
    default: "."
  base:
    description: >-
      For `doctor`: the git ref to compare with. On a pull request, the base commit when empty.
    required: false
    default: ""
  with:
    description: >-
      Packages to replace in the subject, one per line: a local checkout such as
      ./packages/my-instrumentation, a git ref, or a version.
    required: false
    default: ""
  scenario:
    description: Scenario IDs to run, one per line. Every scenario when empty.
    required: false
    default: ""
  expect:
    description: >-
      The path of an expectation file. The step fails when the failing checks differ from it.
      Write one with `spantruth run --write-expect FILE`.
    required: false
    default: ""
  latest:
    description: Unpin the subject's tracked packages and the provider SDKs.
    required: false
    default: "false"
  artifact-name:
    description: The name of the artifact with the results and the HTML report.
    required: false
    default: ""
  comment:
    description: >-
      On a pull request, keep one comment up to date with what changed. It needs
      `pull-requests: write`. A fork's pull request has a read-only token, so the step warns and
      the job goes on.
    required: false
    default: "false"
  token:
    description: The token that writes the comment.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: >-
      0 when every cell ran and the failing checks match the expectation file, 1 when they
      differ, 2 for a usage error, 3 when spantruth could not run a cell. For `doctor`: 1 when
      the change adds a finding, or with no base when there is a finding; 2 when there is nothing
      to check.
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: The path of the results document.
    value: ${{ steps.run.outputs.results }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-suffix: spantruth

    # Inputs reach the script through the environment only, never through ${{ }} in the script.
    # spantruth is installed from the checkout of this action, so its version is the action ref.
    - id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SUBJECT: ${{ inputs.subject }}
        PROJECT: ${{ inputs.path }}
        BASE: ${{ inputs.base }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        WITH: ${{ inputs.with }}
        SCENARIO: ${{ inputs.scenario }}
        EXPECT: ${{ inputs.expect }}
        LATEST: ${{ inputs.latest }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        COMMENT: ${{ inputs.comment }}
      run: |
        set -euo pipefail
        # When installing spantruth fails, the run could not happen: report exit code 3.
        trap 'echo "exit-code=3" >> "$GITHUB_OUTPUT"' ERR
        # One directory per step: a job can run the action more than once.
        out="$(mktemp -d "$RUNNER_TEMP/spantruth.XXXXXX")"
        uv venv --quiet --no-config --python 3.12 "$out/venv"
        uv pip install --quiet --no-config --python "$out/venv/bin/python" "$GITHUB_ACTION_PATH"
        spantruth="$out/venv/bin/spantruth"

        case "${COMMAND:-run}" in
          run)
            if [ -z "$SUBJECT" ]; then
              echo "::error::spantruth: the run command needs the subject input"
              echo "exit-code=2" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            args=(run --subject "$SUBJECT")
            while read -r line; do
              if [ -n "$line" ]; then args+=(--with "$line"); fi
            done <<< "$WITH"
            if [ -n "$EXPECT" ]; then args+=(--expect "$EXPECT"); fi
            if [ "$LATEST" = "true" ]; then args+=(--latest); fi
            label="$(basename "$SUBJECT")"
            ;;
          doctor)
            project="${PROJECT:-.}"
            args=(doctor "$project")
            repo="$project"
            if [ -f "$repo" ]; then repo="$(dirname "$repo")"; fi
            base="${BASE:-${BASE_SHA:-}}"
            if [[ "$base" == -* ]]; then
              # A ref is never an option: `--upload-pack=...` must not reach git.
              echo "::error::spantruth: the base input is a git ref, and it cannot start with -"
              echo "exit-code=2" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$base" ]; then
              # A shallow checkout has no base commit, and fetching a branch such as main updates
              # only origin/main, so the fetched commit is read from FETCH_HEAD.
              commit="$(git -C "$repo" rev-parse --verify --quiet --end-of-options "$base^{commit}")" ||
                commit=""
              if [ -z "$commit" ] &&
                git -C "$repo" fetch --quiet --no-tags --depth=1 --end-of-options origin "$base"; then
                commit="$(git -C "$repo" rev-parse --verify --quiet --end-of-options "FETCH_HEAD^{commit}")" ||
                  commit=""
              fi
              if [ -n "$commit" ]; then
                args+=(--base "$commit")
              else
                echo "::warning::spantruth could not find the base commit, so doctor does not compare and fails on any finding"
              fi
            fi
            # One comment and one artifact per project path: a monorepo runs a step per subproject.
            label="doctor$(printf '%s' "${project#./}" | sed -e 's#/*$##' -e 's#^\.$##' | tr -c 'A-Za-z0-9._' '_' | sed -e 's#^.#-&#')"
            ;;
          *)
            echo "::error::spantruth: the command input is run or doctor"
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        args+=(--out "$out/results.json" --summary "$GITHUB_STEP_SUMMARY")
        while read -r line; do
          if [ -n "$line" ]; then args+=(--scenario "$line"); fi
        done <<< "$SCENARIO"
        if [ "$COMMENT" = "true" ]; then
          args+=(--comment "$out/comment.md")
          args+=(--comment-link "${GITHUB_SERVER_URL:-}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}")
        fi

        code=0
        "$spantruth" "${args[@]}" || code=$?
        if [ -f "$out/results.json" ]; then
          "$spantruth" report "$out/results.json" --html "$out/report.html" > /dev/null ||
            echo "::warning::spantruth could not render the HTML report"
        fi

        name="${ARTIFACT_NAME:-spantruth-$label}"
        {
          echo "exit-code=$code"
          echo "results=$out/results.json"
          echo "out-dir=$out"
          echo "artifact-name=$name"
          if [ -f "$out/comment.md" ]; then
            echo "comment-file=$out/comment.md"
            echo "comment-marker=$(head -n 1 "$out/comment.md")"
          fi
        } >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.run.outputs.artifact-name != ''
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.out-dir }}/results.json
          ${{ steps.run.outputs.out-dir }}/report.html
        if-no-files-found: ignore

    # A comment is a convenience: nothing here can fail the job.
    - id: comment
      if: always() && github.event.pull_request.number && steps.run.outputs.comment-file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        COMMENT_FILE: ${{ steps.run.outputs.comment-file }}
        MARKER: ${{ steps.run.outputs.comment-marker }}
      run: |
        comments="repos/$REPOSITORY/issues/$PR_NUMBER/comments"
        id="$(gh api --paginate "$comments" --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | head -n 1)"
        if [ -n "$id" ] && gh api -X PATCH "repos/$REPOSITORY/issues/comments/$id" -F "body=@$COMMENT_FILE" > /dev/null; then
          exit 0
        fi
        if ! gh api -X POST "$comments" -F "body=@$COMMENT_FILE" > /dev/null; then
          echo "::warning::spantruth could not comment. The token needs pull-requests: write, and a pull request from a fork has a read-only token."
        fi
        exit 0

    - shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${CODE:-3}"
