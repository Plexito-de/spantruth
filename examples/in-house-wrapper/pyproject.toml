[project]
name = "acme-llm"
version = "0.1.0"
description = "The kind of LLM wrapper that a company writes for itself. It has bugs on purpose."
requires-python = ">=3.11"
dependencies = ["openai", "opentelemetry-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["acme_llm.py"]
