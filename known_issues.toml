[[issue]]
subject = "openinference"
scenarios = ["openai/async-stream-helper"]
check = "response_model"
status = "reported"
url = "https://github.com/Arize-ai/openinference/issues/1134"
reported_on = "2024-11-23"
note = "The span of an async with_streaming_response stream gets no model, finish reason or token counts. The issue reports the likely cause: on the async path the wrapper calls AsyncAPIResponse.parse() without awaiting it."

