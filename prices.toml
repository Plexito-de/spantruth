# List prices in USD per million tokens, for the models the scenarios name. The report uses them to
# show what a wrong count does to a cost figure. A model with no row shows no cost.
#
# A cache write has two rates, by how long the cache keeps it. `cache_write` is the rate for the
# default lifetime and `cache_write_long` the rate for the long one. Anthropic: 5 minutes and
# 1 hour. OpenAI: 30 minutes and 12 hours, on GPT-5.6 and later. OpenAI bills no cache write on
# `gpt-5-mini`, so both equal `input` there.
#
# These are the standard rates. A batch call, a priority or fast tier and US-only inference each
# multiply every rate of a call by one factor, so they do not change the percent that a wrong
# count causes. No scenario sends one. `impact.unpriced` names such a field, and the test suite
# fails on a fixture that sends one.
#
# A model with other rates for a long prompt does not fit this table: Claude Haiku 5.5 over
# 100,000 tokens, and the long-context rates of OpenAI's GPT-5.6 and later.

as_of = "2026-11-15"

[models."claude-sonnet-5-5"]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 2.0
cache_read = 0.10
cache_write = 2.50
cache_write_long = 4.0
output = 10.0

[models."gpt-5.6-luna"]
source = "https://developers.openai.com/api/docs/pricing"
input = 0.20
cache_read = 0.02
cache_write = 0.25
cache_write_long = 0.50
output = 1.20

[models."gpt-5-mini"]
source = "https://developers.openai.com/api/docs/pricing"
input = 0.25
cache_read = 0.025
cache_write = 0.25
cache_write_long = 0.25
output = 2.0

# Read on 2026-11-26 (the page now redirects to https://aistudio.google.com/docs/pricing), the
# Standard tier. The output rate includes thinking tokens. Gemini bills no per-token cache write,
# only cache reads and an hourly storage price that no response reports, so both write rates equal
# `input`, as on `gpt-5-mini`.
[models."gemini-3.5-flash-lite"]
source = "https://ai.google.dev/gemini-api/docs/pricing"
input = 0.30
cache_read = 0.03
cache_write = 0.30
cache_write_long = 0.30
output = 2.50
