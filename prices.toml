# List prices in USD per million tokens, for the models the scenarios name. The report uses them to
# show what a wrong count does to a cost figure. A model with no row shows no cost.
#
# OpenAI bills no separate rate for a cache write, so `cache_write` equals `input` there.

as_of = "2026-11-06"

[models."claude-sonnet-5-5"]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 2.0
cache_read = 0.10
cache_write = 2.50
output = 10.0

[models."gpt-5-mini"]
source = "https://developers.openai.com/api/docs/pricing"
input = 0.25
cache_read = 0.025
cache_write = 0.25
output = 2.0
