[project]
name = "spantruth"
version = "0.2.0"
description = "Checks the values LLM instrumentation libraries report against what the provider actually sent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Plexito UG (haftungsbeschränkt)", email = "info@plexito.de" }]
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-proto>=1.30",
    "protobuf>=5",
]
keywords = ["opentelemetry", "llm", "observability", "genai", "semantic-conventions", "conformance", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Plexito-de/spantruth"
Issues = "https://github.com/Plexito-de/spantruth/issues"
Report = "https://plexito-de.github.io/spantruth/"

[project.scripts]
spantruth = "spantruth.cli:main"

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-timeout>=2.4",
    "openai>=2",
    "anthropic>=0.70",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
lint = ["ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spantruth"]

[tool.uv]
default-groups = ["test", "lint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 120
markers = [
    "slow: builds a subject virtual environment or runs a subprocess (more than 1 s)",
    "external: downloads packages from PyPI",
]
addopts = "-ra"
