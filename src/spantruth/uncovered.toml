# Python packages for LLM calls that no subject covers yet. `spantruth doctor` names each one it
# finds in a project, with the issue where a user can ask for it, so a project is never left with
# nothing to do. The key is the package name as PyPI normalizes it.
#
# A package that a library subject detects is covered, and doctor skips its entry here. Delete the
# entry when the subject or provider lands.

[litellm]
title = "LiteLLM"
issue = "https://github.com/Plexito-de/spantruth/issues/76"

