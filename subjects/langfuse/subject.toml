title = "Langfuse Python SDK"
homepage = "https://github.com/langfuse/langfuse-python"
providers = ["openai"]
packages = ["langfuse==5.2.0"]
track = ["langfuse"]
notes = "The documented setup: from langfuse.openai import openai, with a throwaway key so Langfuse does not turn itself off. base_url points at the harness receiver so Langfuse's own export does not attempt an outbound connection; any POST to its own path (/api/public/otel/v1/traces) is answered 200 by the receiver. The driver's tracer provider exports the span to /v1/traces."

# langfuse.openai always records input and output. Only a mask function rewrites them.
[content]
switch = "none for langfuse.openai"
docs = "https://github.com/langfuse/langfuse-python/blob/8e6c60db5f76f8cfacb536a7564a3f42f078efdc/langfuse/openai.py#L446-L470"
default = "on"
on = {}
