title = "LiteLLM"
homepage = "https://github.com/BerriAI/litellm"
providers = ["openai", "anthropic"]
packages = ["litellm==1.111.0"]
track = ["litellm"]
notes = "A framework: the app calls litellm.completion, and LiteLLM makes the provider call. The documented setup, litellm.callbacks = [\"otel\"], with LiteLLM's default conventions. The OpenAI Responses API and the OpenAI SDK's with_streaming_response helper are not LiteLLM calls, so those scenarios are not run. Nor is anthropic/retry-429: LiteLLM's Anthropic client is not the Anthropic SDK and does not retry, and LiteLLM's own retries (num_retries) need tenacity, which LiteLLM does not install. The environment turns off LiteLLM's fetches of its cost map and Anthropic beta-header table."
# Every chat call that LiteLLM makes: not the Responses API, not the OpenAI SDK's streaming helper.
scenarios = [
  "openai/basic",
  "openai/stream",
  "openai/stream-early-exit",
  "openai/stream-early-exit-with",
  "openai/cache-hit",
  "openai/stream-cache-hit",
  "openai/cache-write",
  "openai/stream-cache-write",
  "openai/stream-no-usage",
  "openai/tool-call",
  "openai/stream-tool-call",
  "openai/rate-limited",
  "openai/retry-429",
  "openai/stream-dropped",
  "openai/reasoning",
  "openai/stream-reasoning",
  "openai/async-basic",
  "openai/async-stream",
  "openai/async-stream-early-exit",
  "openai/async-stream-dropped",
  "anthropic/basic",
  "anthropic/stream",
  "anthropic/stream-early-exit",
  "anthropic/stream-early-exit-with",
  "anthropic/cache-hit",
  "anthropic/stream-cache-hit",
  "anthropic/stream-cache-cumulative",
  "anthropic/cache-1h",
  "anthropic/stream-cache-1h",
  "anthropic/stream-error-event",
  "anthropic/tool-call",
  "anthropic/stream-tool-call",
  "anthropic/rate-limited",
  "anthropic/stream-dropped",
  "anthropic/thinking",
  "anthropic/stream-thinking",
  "anthropic/async-basic",
  "anthropic/async-stream",
  "anthropic/async-stream-early-exit",
  "anthropic/async-stream-error-event",
  "anthropic/async-stream-dropped",
]

[env]
# LiteLLM fetches its model cost map and Anthropic beta-header table from GitHub unless these say
# to use the copies it ships. Its offline mode covers the other catalogs it fetches on its own.
LITELLM_LOCAL_MODEL_COST_MAP = "True"
LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS = "True"
LITELLM_OFFLINE_MODE = "true"
