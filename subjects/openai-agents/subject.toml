title = "OpenAI Agents SDK (OpenInference)"
homepage = "https://github.com/openai/openai-agents-python"
providers = ["openai"]
packages = [
  "openai-agents==0.26.0",
  "openinference-instrumentation-openai-agents==2.8.7",
]
track = ["openai-agents", "openinference-instrumentation-openai-agents"]
detect = ["openai-agents"]
notes = "A framework: the app runs an Agent with Runner, and the Agents SDK makes the call through OpenAIChatCompletionsModel, or OpenAIResponsesModel for a Responses scenario. The documented OpenTelemetry route, OpenInference's OpenAIAgentsInstrumentor, which replaces the SDK's exporter to the OpenAI backend. The SDK streams only from an event loop, so each sync stream scenario makes the same call as its async twin. Not run: the early exits (Runner reads the model stream in a background task, run.py's run_loop_task, and queues its events, so how far the SDK reads does not depend on how far the app reads: with the fake provider it reads the whole stream before the app reads its second event, and the scenario's truth, what the app read, does not apply), tool calls (the agent would answer each tool call with another model call, and the fake provider repeats the tool call until the turn limit), the OpenAI SDK's with_streaming_response helper and the with-block early exits (no Agents SDK call has either)."
# Every call an agent run makes for one model answer.
scenarios = [
  "openai/basic",
  "openai/stream",
  "openai/cache-hit",
  "openai/stream-cache-hit",
  "openai/cache-write",
  "openai/stream-cache-write",
  "openai/stream-no-usage",
  "openai/rate-limited",
  "openai/retry-429",
  "openai/stream-dropped",
  "openai/reasoning",
  "openai/stream-reasoning",
  "openai/async-basic",
  "openai/async-stream",
  "openai/async-stream-dropped",
  "openai/responses-stream-missing-finish-abort",
]
