title = "OpenTelemetry GenAI instrumentation"
homepage = "https://github.com/open-telemetry/opentelemetry-python-genai"
providers = ["openai", "anthropic"]
packages = [
  "opentelemetry-instrumentation-genai-openai==1.3b0",
  "opentelemetry-instrumentation-genai-anthropic==1.3b0",
]
track = [
  "opentelemetry-instrumentation-genai-openai",
  "opentelemetry-instrumentation-genai-anthropic",
]

# Off by default. SPAN_AND_EVENT records the text on the span and in the details event.
[content]
switch = "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT"
docs = "https://github.com/open-telemetry/opentelemetry-python-genai/blob/e25770aa361043fc5b4902c82eceb9ce86dc103e/util/opentelemetry-util-genai/README.rst#L182-L189"
default = "off"
off = { OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT = "NO_CONTENT" }
on = { OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT = "SPAN_AND_EVENT" }

# Both instrumentors use TelemetryHandler, which records gen_ai.client.token.usage.
[metrics]
docs = "https://github.com/open-telemetry/opentelemetry-python-genai/blob/e25770aa361043fc5b4902c82eceb9ce86dc103e/util/opentelemetry-util-genai/README.rst#L15-L16"
